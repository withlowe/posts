name = "posts"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "POSTS"
id = "REPLACE_WITH_YOUR_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "posts"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[triggers]
crons = ["0 * * * *"]

# Optional: bind an R2 bucket for attachments. Without it, encrypted
# attachments fall back to D1 and are capped at 256 KB of ciphertext.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "posts-media"
